<h2 mat-dialog-title class="flex items-center gap-2 text-lg font-bold text-slate-900 dark:text-slate-100">
  <mat-icon color="primary">alarm_on</mat-icon>
  <span>{{ i18n.t().sla.reviewModalTitle }}</span>
</h2>

<mat-dialog-content>
  <div class="grid grid-cols-2 gap-4 my-4">
    <div class="flex flex-col items-center p-5 rounded-lg border text-center bg-slate-50 border-slate-200 dark:bg-slate-800 dark:border-slate-700">
      <span class="text-3xl font-bold text-slate-900 dark:text-slate-100">{{ data.reviewed }}</span>
      <span class="mt-1 text-xs text-slate-500 dark:text-slate-400 font-medium">{{ i18n.t().sla.reviewedCount }}</span>
    </div>
    <div class="flex flex-col items-center p-5 rounded-lg border text-center bg-amber-50 border-amber-300 dark:bg-amber-950/40 dark:border-amber-800">
      <span class="text-3xl font-bold text-amber-700 dark:text-amber-300">{{ data.escalated }}</span>
      <span class="mt-1 text-xs text-slate-500 dark:text-slate-400 font-medium">{{ i18n.t().sla.escalatedCount }}</span>
    </div>
    <div class="flex flex-col items-center p-5 rounded-lg border text-center bg-red-50 border-red-300 dark:bg-red-950/40 dark:border-red-800">
      <span class="text-3xl font-bold text-red-700 dark:text-red-300">{{ data.breached }}</span>
      <span class="mt-1 text-xs text-slate-500 dark:text-slate-400 font-medium">{{ i18n.t().sla.breachedCount }}</span>
    </div>
    <div
      class="flex flex-col items-center p-5 rounded-lg border text-center transition-colors"
      [ngClass]="data.failed > 0
        ? 'bg-red-50 border-red-300 dark:bg-red-950/40 dark:border-red-800'
        : 'bg-slate-50 border-slate-200 dark:bg-slate-800 dark:border-slate-700'">
      <span
        class="text-3xl font-bold"
        [ngClass]="data.failed > 0 ? 'text-red-700 dark:text-red-300' : 'text-slate-900 dark:text-slate-100'">
        {{ data.failed }}
      </span>
      <span class="mt-1 text-xs text-slate-500 dark:text-slate-400 font-medium">{{ i18n.t().sla.failedCount }}</span>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="pt-4 gap-2">
  <button mat-flat-button color="primary" [mat-dialog-close]="true">
    {{ i18n.t().app.close }}
  </button>
</mat-dialog-actions>
