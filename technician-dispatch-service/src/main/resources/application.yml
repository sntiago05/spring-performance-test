server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: technician-dispatch-service
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  mvc:
    problemdetails:
      enabled: true

dispatch:
  # Technician codes returned by the simulation: TEC-001 .. TEC-<pool size>
  technician-pool-size: ${DISPATCH_TECHNICIAN_POOL_SIZE:15}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    custom-css-url: /swagger-ui-custom.css
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
