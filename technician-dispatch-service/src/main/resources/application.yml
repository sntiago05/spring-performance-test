server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: technician-dispatch-service
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  mvc:
    problemdetails:
      enabled: true

dispatch:
  # Simulated technician pool. The suggestion is picked among the technicians able to handle the ticket category
  # (own specialty, or OTRO = generalist; tickets of category OTRO accept anybody). The codes match the technicians
  # seeded in support-ticket-service (TEC-001..TEC-015); a technician created later there is simply unknown here.
  technicians:
    - {code: TEC-001, specialty: HARDWARE}
    - {code: TEC-002, specialty: HARDWARE}
    - {code: TEC-003, specialty: HARDWARE}
    - {code: TEC-004, specialty: SOFTWARE}
    - {code: TEC-005, specialty: SOFTWARE}
    - {code: TEC-006, specialty: SOFTWARE}
    - {code: TEC-007, specialty: RED}
    - {code: TEC-008, specialty: RED}
    - {code: TEC-009, specialty: RED}
    - {code: TEC-010, specialty: ACCESOS}
    - {code: TEC-011, specialty: ACCESOS}
    - {code: TEC-012, specialty: ACCESOS}
    - {code: TEC-013, specialty: OTRO}
    - {code: TEC-014, specialty: OTRO}
    - {code: TEC-015, specialty: OTRO}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    custom-css-url: /swagger-ui-custom.css
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
