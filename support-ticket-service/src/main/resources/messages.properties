# ---- Bean Validation ----
validation.required=is required
validation.size=length must be between {min} and {max}
validation.range=must be between {min} and {max}
validation.document.format=must contain 5 to 30 letters, digits or hyphens
validation.email.corporate=must be a valid corporate e-mail address (public providers such as gmail.com are not accepted)
validation.status-change.invalid=the status change request is not valid
validation.status-change.use-assignment=ASIGNADO cannot be set directly; assign a technician with PUT /tickets/{id}/assignment
validation.status-change.cancel-reason=cancelling a ticket requires observations of at least 15 characters

# ---- Generic problems ----
problem.validation-error.title=Validation failed
problem.validation-error.detail=The request contains invalid fields. See the errors list.
problem.malformed-request.title=Malformed request
problem.malformed-request.detail=The request body is missing, is not valid JSON or contains an unknown enum value.
problem.invalid-parameter.title=Invalid parameter
problem.invalid-parameter.detail=The value of the parameter {0} is not valid.
problem.unauthorized.title=Authentication required
problem.unauthorized.detail=A valid Bearer token is required. Log in with POST /auth/login.
problem.forbidden.title=Access denied
problem.forbidden.detail=Your role does not allow this operation.
problem.concurrent-modification.title=Concurrent modification
problem.concurrent-modification.detail=The resource was modified by someone else at the same time. Reload it and try again.
problem.data-integrity.title=Data conflict
problem.data-integrity.detail=The operation conflicts with existing data (a unique value is already in use or a reference is invalid).
problem.internal-error.title=Internal error
problem.internal-error.detail=An unexpected error occurred. Quote the traceId when reporting it.

