server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: support-ticket-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/helpflow}
    username: ${DB_USER:helpflow}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # the schema belongs to Flyway; Hibernate only checks it matches the entities
    properties:
      hibernate:
        default_batch_fetch_size: 16
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

app:
  dispatch:
    base-url: ${DISPATCH_BASE_URL:http://localhost:8081}
    connect-timeout: ${DISPATCH_CONNECT_TIMEOUT:PT1S}
    read-timeout: ${DISPATCH_READ_TIMEOUT:PT2S}
  security:
    jwt:
      secret: ${JWT_SECRET} # required, at least 32 characters; never committed
      issuer: helpflow-support-ticket-service
      expiration: ${JWT_EXPIRATION:PT1H}
  sla:
    review-enabled: true
    review-interval: ${SLA_REVIEW_INTERVAL:PT1M}
    review-initial-delay: PT30S
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@helpflow.example}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    technician-password: ${BOOTSTRAP_TECHNICIAN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: support-ticket-service
    description: HelpFlow IT support ticket service

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
  default-produces-media-type: application/json
