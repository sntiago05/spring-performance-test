# ---- Bean Validation ----
validation.required=es obligatorio
validation.size=la longitud debe estar entre {min} y {max}
validation.range=debe estar entre {min} y {max}
validation.document.format=debe contener de 5 a 30 letras, dígitos o guiones
validation.email.corporate=debe ser un correo corporativo válido (no se aceptan proveedores públicos como gmail.com)
validation.status-change.invalid=la solicitud de cambio de estado no es válida
validation.status-change.use-assignment=ASIGNADO no se puede establecer directamente; asigne un técnico con PUT /tickets/{id}/assignment
validation.status-change.cancel-reason=cancelar un ticket requiere observaciones de al menos 15 caracteres

# ---- Generic problems ----
problem.validation-error.title=Validación fallida
problem.validation-error.detail=La solicitud contiene campos inválidos. Revise la lista de errores.
problem.malformed-request.title=Solicitud mal formada
problem.malformed-request.detail=El cuerpo de la solicitud falta, no es JSON válido o contiene un valor de enumeración desconocido.
problem.invalid-parameter.title=Parámetro inválido
problem.invalid-parameter.detail=El valor del parámetro {0} no es válido.
problem.unauthorized.title=Autenticación requerida
problem.unauthorized.detail=Se requiere un token Bearer válido. Inicie sesión con POST /auth/login.
problem.forbidden.title=Acceso denegado
problem.forbidden.detail=Su rol no permite esta operación.
problem.concurrent-modification.title=Modificación concurrente
problem.concurrent-modification.detail=Otra persona modificó el recurso al mismo tiempo. Recárguelo e inténtelo de nuevo.
problem.data-integrity.title=Conflicto de datos
problem.data-integrity.detail=La operación entra en conflicto con datos existentes (un valor único ya está en uso o una referencia no es válida).
problem.internal-error.title=Error interno
problem.internal-error.detail=Ocurrió un error inesperado. Indique el traceId al reportarlo.

